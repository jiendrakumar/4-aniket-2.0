
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Products | RB AQUA & APPLIANCES</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .products-header {
            background: #073b5c;
            color: white;
            text-align: center;
            padding: 45px 15px;
        }

        .products-header h1 {
            font-size: 36px;
            font-weight: 700;
        }

        .products-header p {
            margin-top: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 22px;
            border: 1px solid white;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: white;
            color: #073b5c;
        }

        .product-card {
            height: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 260px;
            object-fit: contain;
            padding: 15px;
            background: white;
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-info h5 {
            font-size: 17px;
            font-weight: 600;
            margin: 0;
        }

        .page-footer {
            margin-top: 30px;
            padding: 18px;
            background: #073b5c;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Page Header -->
    <header class="products-header">
        <div class="container">
            <h1>Our Products</h1>

            <p>
                Explore our range of water purifiers and home appliances.
            </p>

            <a href="index.html" class="back-btn">
                &larr; Back to Home
            </a>
        </div>
    </header>

    <!-- All Product Images -->
    <section class="container py-5">

        <h2 class="text-center mb-4">All Products</h2>

        <div class="row g-4">

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card">
                    <img src="1.jpeg" alt="RO Water Purifier">
                    <div class="product-info">
                        <h5>RO Water Purifier</h5>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card">
                    <img src="2.png" alt="Alkaline Water Purifier">
                    <div class="product-info">
                        <h5>Alkaline Water Purifier</h5>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card">
                    <img src="3.png" alt="UV Water Purifier">
                    <div class="product-info">
                        <h5>UV Water Purifier</h5>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card">
                    <img src="4.png" alt="Gravity Water Purifier">
                    <div class="product-info">
                        <h5>Gravity Water Purifier</h5>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card">
                    <img src="5.png" alt="Commercial RO System">
                    <div class="product-info">
                        <h5>Commercial RO System</h5>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card">
                    <img src="6.png" alt="Water Purifier">
                    <div class="product-info">
                        <h5>Water Purifier</h5>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Page Footer -->
    <footer class="page-footer">
        <p class="mb-0">
            &copy; 2026 RB AQUA & APPLIANCES. All rights reserved.
        </p>
    </footer>

</body>
</html>
